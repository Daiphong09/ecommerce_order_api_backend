services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    container_name: ecommerce_api
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ecommerce_api_data:/var/lib/postgresql/data
volumes:
  ecommerce_api_data:
  